<app-page-header
  title="Vessels"
  subtitle="Manage vessel details, status and registration information."
>
  <a class="btn btn-primary" routerLink="/vessels/new">
    <i class="ri-add-line me-1"></i>
    New vessel
  </a>
</app-page-header>

<div class="filters card-surface">
  <div class="filters__search">
    <i class="ri-search-line"></i>

    <input
      type="search"
      class="form-control"
      placeholder="Search by vessel name or IMO"
      aria-label="Search vessels"
      (input)="onSearchInput($any($event.target).value)"
    />
  </div>

  <select
    class="form-select filters__select"
    aria-label="Filter by vessel type"
    [ngModel]="typeFilter()"
    (ngModelChange)="typeFilter.set($event); onFilterChange()"
  >
    <option value="">All types</option>

    @for (type of vesselTypes; track type) {
      <option [value]="type">
        {{ type }}
      </option>
    }
  </select>

  <select
    class="form-select filters__select"
    aria-label="Filter by status"
    [ngModel]="statusFilter()"
    (ngModelChange)="statusFilter.set($event); onFilterChange()"
  >
    <option value="all">All statuses</option>
    <option value="active">Active only</option>
    <option value="inactive">Inactive only</option>
  </select>
</div>

<app-data-table
  [columns]="columns"
  [rows]="rows()"
  [loading]="loading()"
  [error]="error()"
  emptyMessage="No vessels match your search."
  [page]="page()"
  [pageSize]="pageSize"
  [totalCount]="totalCount()"
  [rowActions]="actions"
  (pageChange)="onPageChange($event)"
  (retry)="load()"
/>

<ng-template #actions let-row>
  <a
    class="btn btn-sm btn-outline-secondary me-1"
    [routerLink]="['/vessels', row.vesselId, 'edit']"
    [attr.aria-label]="'Edit ' + row.vesselName"
  >
    <i class="ri-pencil-line"></i>
  </a>

  @if (row.isActive) {
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary"
      [attr.aria-label]="'Deactivate ' + row.vesselName"
      (click)="askDeactivate(row)"
    >
      <i class="ri-forbid-2-line"></i>
    </button>
  } @else {
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary"
      [attr.aria-label]="'Reactivate ' + row.vesselName"
      (click)="reactivate(row)"
    >
      <i class="ri-refresh-line"></i>
    </button>
  }
</ng-template>

@if (pendingDeactivate(); as target) {
  <app-confirm-dialog
    title="Deactivate vessel"
    [message]="
      'Deactivate ' +
      target.vesselName +
      '? It will stop appearing as active, and you can reactivate it later.'
    "
    confirmLabel="Deactivate"
    [busy]="deactivating()"
    (confirmed)="confirmDeactivate()"
    (cancelled)="pendingDeactivate.set(null)"
  />
}
