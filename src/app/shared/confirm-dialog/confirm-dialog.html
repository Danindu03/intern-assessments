<div class="backdrop" (click)="cancelled.emit()"></div>

<div class="dialog card-surface" role="dialog" aria-modal="true" [attr.aria-label]="title()">
  <h2 class="dialog__title">{{ title() }}</h2>
  <p class="dialog__message">{{ message() }}</p>

  <div class="dialog__actions">
    <button type="button" class="btn btn-outline-secondary" (click)="cancelled.emit()">
      {{ cancelLabel() }}
    </button>
    <button type="button" class="btn btn-danger" [disabled]="busy()" (click)="confirmed.emit()">
      @if (busy()) { <span class="spinner-border spinner-border-sm me-1"></span> }
      {{ confirmLabel() }}
    </button>
  </div>
</div>
